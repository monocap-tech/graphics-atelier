<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G06-P07 | Interleave</title>
<style>body{font:16px system-ui,sans-serif;background:#121b26;color:#e4eaf0;max-width:840px;margin:20px auto;padding:0 12px}canvas{width:100%;height:auto;image-rendering:pixelated;border:1px solid #52677c}label{display:inline-block;margin:8px}button,select,input{font:inherit}input[type=range]{width:80%}</style>
<h1>Interleave / G06-P07</h1><p>Shared operation: directional transport, division, and independent residual movement. Abstract recurrence versus conditional impact. Silent fixed-tick prototype.</p><label>Scene <select id="scene"><option value="abstract">Abstract interleave</option><option value="hit">Guard intercepts</option><option value="miss">Guard misses</option><option value="cancel">Cancel in flight</option><option value="moving">Moving guard</option></select></label><label><input type="checkbox" id="fx" checked>Decorative effects</label><button id="play">Play</button> <button id="stop">Stop</button><canvas id="stage" width="640" height="360" aria-label="Motion study"></canvas><label>Tick <input id="tick" type="range" min="0" max="71" value="0"></label><output id="status"></output>
<script>
const W=160,H=90,T=72,HZ=24,scale=4,bg='#121b26',muted='#30465b',cyan='#76d0c7',ivory='#e8f1d2',gold='#e9a66c',violet='#9384be';
const $=id=>document.getElementById(id),out=$('stage').getContext('2d'),logical=document.createElement('canvas');logical.width=W;logical.height=H;const g=logical.getContext('2d');
function guardY(s,t){return s==='miss'?16:s==='moving'?15+Math.min(t,30):45}
function trace(s){let x=12,phase='idle',event=null;const rows=[];for(let t=0;t<T;t++){const gy=guardY(s,t);let impact=false;if(t===6)phase='flight';if(phase==='flight'&&s==='cancel'&&t===18){phase='cancelled';event=t}else if(phase==='flight'&&t>6){const next=x+4;if(x<96&&next>=96&&Math.abs(45-gy)<=9){x=96;phase='blocked';event=t;impact=true}else{x=next;if(x>=160){phase='exited';event=t}}}rows.push({t,x,gy,phase,event,impact,active:phase==='flight'})}return rows}
const traces=Object.fromEntries(['hit','miss','cancel','moving'].map(s=>[s,trace(s)]));
function poly(p,c,a=1){g.globalAlpha=a;g.fillStyle=c;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill();g.globalAlpha=1}
function line(x,y,X,Y,c,w=1,a=1){g.globalAlpha=a;g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke();g.globalAlpha=1}
function dot(x,y,c,r=1){g.fillStyle=c;g.fillRect(Math.round(x)-r,Math.round(y)-r,2*r+1,2*r+1)}
function ribbon(head,len,y,amp,c,shift=0){let p=[];for(let i=0;i<=12;i++){const u=i/12,x=head-len*u,cy=y+amp*Math.sin(u*5+shift),w=(.4+3*Math.sin(Math.PI*u));p.push([x,cy-w])}for(let i=12;i>=0;i--){const u=i/12,x=head-len*u,cy=y+amp*Math.sin(u*5+shift),w=(.4+3*Math.sin(Math.PI*u));p.push([x,cy+w])}poly(p,c);line(head-4,y,head,y,c,1)}
function abstract(t,fx){line(8,45,152,45,muted,.5);for(const [start,sgn,col] of [[0,-1,cyan],[16,1,violet]]){const u=t-start;if(u<0||u>=52)continue;const head=15+u*2.65,y=45+sgn*(u<18?17*(1-u/18):u<36?0:Math.min(18,(u-36)*1.2));const len=Math.min(26,4+u*2);if(u<18||u>=36){ribbon(head,len,y,6*sgn,col,u*.14)}else{const spread=2+Math.sin((u-18)/18*Math.PI)*12;ribbon(head,len,y-spread,3*sgn,col,u*.14);ribbon(head-4,len*.7,y+spread,-3*sgn,col,u*.14)}if(fx&&u>=16&&u<44){for(let j=0;j<3;j++){const k=u-16-j*4;if(k>=0&&k<16){const x=head-24-j*6-k*.45,Y=y+sgn*(8+k*.9);poly([[x,Y],[x-5,Y-2],[x-2,Y+2]],gold,1-k/16)}}}}return {phase:'autonomous',active:false}}
function interactive(s,t,fx){const f=traces[s][t];for(let x=0;x<160;x+=16)line(x,0,x,90,muted,.4);line(0,45,160,45,muted,.5);poly([[4,37],[14,40],[14,50],[4,53]],muted);line(96,f.gy-9,96,f.gy+9,violet,2);dot(96,f.gy-9,ivory,1);dot(96,f.gy+9,ivory,1);
if(f.active){if(fx)ribbon(f.x-3,Math.min(f.x-11,21),45,2,cyan,t*.32);poly([[f.x+3,45],[f.x-6,42],[f.x-4,45],[f.x-6,48]],ivory)}
if(f.phase==='blocked'){const a=t-f.event;if(a<5){line(96,40,96,50,ivory,3,1-a/5);dot(96,45,gold,2)}if(fx&&a<24){for(let j=0;j<5;j++){const age=a-j*2;if(age<0||age>=15)continue;const dir=j%2?1:-1,x=94-age*(.8+j*.13),y=45+dir*age*(.9+j*.24);poly([[x,y],[x+5,y-dir*2],[x+2,y-dir*5]],j===0?ivory:gold,1-age/15)}}}
if(f.phase==='cancelled'&&fx&&t-f.event<10){const a=t-f.event;line(f.x-6-a,45,f.x-a,45,cyan,1,1-a/10)}return f}
function renderAt(s,t,fx=true){g.globalAlpha=1;g.fillStyle=bg;g.fillRect(0,0,W,H);const f=s==='abstract'?abstract(t,fx):interactive(s,t,fx);out.setTransform(1,0,0,1,0,0);out.imageSmoothingEnabled=false;out.drawImage(logical,0,0,W*scale,H*scale);$('tick').value=t;$('status').value=s+' / '+f.phase+' / tick '+t;return f}
window.renderAt=renderAt;window.traces=traces;let raf=0;function stop(){cancelAnimationFrame(raf)}function paint(t){renderAt($('scene').value,t,$('fx').checked)}$('play').onclick=()=>{stop();const start=performance.now();function step(now){const t=Math.min(T-1,Math.floor((now-start)*HZ/1000));paint(t);if(t<T-1)raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step)};$('stop').onclick=stop;for(const id of ['scene','tick','fx'])$(id).oninput=()=>{stop();paint(+$('tick').value)};paint(0);
</script></html>
